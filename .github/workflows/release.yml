name: Automatic Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
  actions: write
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      # Migrated off codfish/semantic-release-action (GitHub ToS-blocked since 2026-06-25,
      # which broke this workflow using all tags) to the maintained cycjimmy action. It reads
      # the existing .releaserc; extra_plugins pre-installs the two plugins semantic-release
      # doesn't bundle.
      # Info why codfish/semantic-release-action is blocked:
      # https://www.aikido.dev/blog/compromised-github-action-codfish-steals-secrets
      - name: Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          branches: main
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.ZAMA_BOT_TOKEN }} # zizmor: ignore[secrets-outside-env]
          GIT_AUTHOR_NAME: 'zama-bot'
          GIT_AUTHOR_EMAIL: 'zama-bot@zama.ai'
          GIT_COMMITTER_NAME: 'zama-bot'
          GIT_COMMITTER_EMAIL: 'zama-bot@zama.ai'
