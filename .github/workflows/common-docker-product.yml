# Build, scan, sign and publish a container image to a generic OCI registry (Harbor by default).
#
# Follows Docker's "Build a trusted delivery pipeline" guide and Chainguard's verification docs:
#   1. build once, push by digest only (no tag yet), with an SBOM and max-level provenance;
#   2. gate on a Trivy scan of that digest;
#   3. verify every Chainguard base image the build used (read from the provenance) against
#      Chainguard's signing identity;
#   4. sign the digest keyless (GitHub OIDC), attest the SPDX SBOM with cosign, and verify the
#      signature against this workflow's identity;
#   5. publish the tags last, pointing at the already-signed digest.
# Without push (pull requests), the image is built and scanned locally, nothing leaves the runner.
# One platform per call: run it once per architecture, on a runner of that architecture.
#
# Caller example:
#
#   jobs:
#     image:
#       permissions:
#         contents: read
#         id-token: write # keyless signing
#       uses: zama-ai/ci-templates/.github/workflows/common-docker-product.yml@<sha> # vX.Y.Z
#       with:
#         image-name: tokenops/core-api
#         docker-target: prod
#         push: ${{ github.event_name != 'pull_request' }}
#         environment: ${{ github.event_name != 'pull_request' && 'image-publish' || '' }}
#       secrets:
#         REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
#         REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
#         CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
#         CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}
#
# Protecting the push credentials: create a GitHub environment (here `image-publish`) that
# only the publishing branches and tags may use, and store REGISTRY_USERNAME /
# REGISTRY_PASSWORD there, not as repository secrets. The caller still passes them by name as
# above (a secret that is not passed resolves to an empty string in a reusable workflow, even
# when it exists in the environment), and this job enters the environment (the `environment`
# input), so it receives the environment's values. Outside that environment, on any other
# ref, the names resolve to nothing. The Chainguard token is read-only and needed by pull
# request builds too, so it can stay a repository secret.
#
# Verifying a published image (deploy side, e.g. a Kyverno verifyImages rule). The identity
# regexp alone accepts a signature made from any ref of ci-templates, so also pin the caller's
# repository, publishing ref and trigger:
#
#   cosign verify \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/zama-ai/ci-templates/\.github/workflows/common-docker-product\.yml@' \
#     --certificate-github-workflow-repository <owner>/<caller-repo> \
#     --certificate-github-workflow-ref refs/heads/main \
#     --certificate-github-workflow-trigger push \
#     <registry>/<image-name>@<digest>
#
# Keyless signing records the caller's repository name, workflow, ref and commit SHA in the
# public Sigstore transparency logs (Fulcio and Rekor), permanently, private repositories
# included. Do not call this workflow with push for a repository whose name or history must
# stay confidential.
#
# Provenance at mode=max records build-arg values and the Dockerfile: never pass a secret
# through `build-args`, use the BUILD_SECRETS secret (BuildKit secret mounts) instead.
name: Docker build, scan, sign and publish (product)

on:
  workflow_call:
    secrets:
      REGISTRY_USERNAME:
        description: "Registry user (Harbor: the project's robot account). Pass it by name; store it in the `environment`"
        required: false
      REGISTRY_PASSWORD:
        description: "Registry password or token. Pass it by name; store it in the `environment`"
        required: false
      CGR_USERNAME:
        description: "Chainguard pull token user, to pull and verify cgr.dev base images"
        required: false
      CGR_PASSWORD:
        description: "Chainguard pull token password"
        required: false
      BUILD_SECRETS:
        description: "BuildKit secrets, one id=value per line, read in the Dockerfile with RUN --mount=type=secret,id=<id>. Never recorded in the image or provenance"
        required: false
    inputs:
      registry:
        description: "Registry host"
        type: string
        default: "hub.zama.org"
      image-name:
        description: "Repository path inside the registry, e.g. `tokenops/core-api`"
        type: string
        required: true
      push:
        description: "Push, sign and tag. False builds and scans locally only (use it for pull requests)"
        type: boolean
        default: true
      environment:
        description: "GitHub environment holding REGISTRY_USERNAME / REGISTRY_PASSWORD, restricted to the publishing refs. Empty: none"
        type: string
        default: ""
      docker-context:
        type: string
        default: "."
      docker-file:
        description: "Dockerfile path (default: <docker-context>/Dockerfile)"
        type: string
        default: ""
      docker-target:
        description: "Dockerfile stage to build (default: the last one)"
        type: string
        default: ""
      build-args:
        description: "Extra build args, one KEY=VALUE per line. Recorded in the provenance: no secrets"
        type: string
        default: ""
      platform:
        description: "Single target platform. Use a runner of the same architecture (no emulation is set up)"
        type: string
        default: "linux/amd64"
      tags:
        description: "docker/metadata-action tag rules. `latest` is never added"
        type: string
        default: |
          type=sha,prefix=,format=short
          type=semver,pattern={{version}}
          type=ref,event=branch
      cache-scope:
        description: "GitHub Actions cache scope (default: the image name)"
        type: string
        default: ""
      runs-on:
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        type: number
        default: 45
      scan-severity:
        description: "Trivy severities that fail the gate"
        type: string
        default: "CRITICAL,HIGH"
      scan-ignore-unfixed:
        description: "Ignore vulnerabilities without a fix"
        type: boolean
        default: true
      scan-exit-code:
        description: "Trivy exit code on findings: '1' gates, '0' reports only"
        type: string
        default: "1"
      verify-base-images:
        description: "Verify the cosign signature of every base image matching base-image-prefixes"
        type: boolean
        default: true
      base-image-prefixes:
        description: "Space separated image name prefixes to verify as Zama Chainguard images"
        type: string
        default: "cgr.dev/zama.ai/"
      base-image-identity-regexp:
        description: "Chainguard signing identity: the zama.ai organisation's service identities"
        type: string
        default: '^https://issuer\.enforce\.dev/5c24d2957df07af000b428f24927edb071be97dc/'
    outputs:
      image:
        description: "<registry>/<image-name>"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Signed manifest digest (empty without push). With a matrix caller: the last job to finish"
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: "Published tags, one per line. With a matrix caller: the last job to finish"
        value: ${{ jobs.build.outputs.tags }}

permissions: {}

jobs:
  build:
    name: ${{ inputs.image-name }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # cosign keyless signing and attestation
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
      PUSH: ${{ inputs.push }}
      HAS_CGR: ${{ secrets.CGR_USERNAME != '' }}
    outputs:
      image: ${{ steps.result.outputs.image }}
      digest: ${{ steps.result.outputs.digest }}
      tags: ${{ steps.result.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check inputs
        env:
          PLATFORM: ${{ inputs.platform }}
          ENVIRONMENT: ${{ inputs.environment }}
          DOCKER_CONTEXT: ${{ inputs.docker-context }}
          DOCKER_FILE: ${{ inputs.docker-file }}
          TAGS: ${{ inputs.tags }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          set -euo pipefail
          workspace="$(realpath -e "${GITHUB_WORKSPACE}")"
          inside() { [[ "$1" == "${workspace}" || "$1" == "${workspace}/"* ]]; }
          # docker/build-push-action also accepts remote Git or HTTP contexts, with or without a
          # scheme: only an existing directory inside the checkout is allowed (buildx prefers a
          # local directory), so the image is always built from this commit.
          context="$(realpath -e -- "${DOCKER_CONTEXT}" 2>/dev/null || true)"
          if [[ -z "${context}" || ! -d "${context}" ]] || ! inside "${context}"; then
            echo "::error::docker-context must be an existing directory inside the repository, got '${DOCKER_CONTEXT}'"
            exit 1
          fi
          if [[ -n "${DOCKER_FILE}" ]]; then
            file="$(realpath -e -- "${DOCKER_FILE}" 2>/dev/null || true)"
            if [[ -z "${file}" || ! -f "${file}" ]] || ! inside "${file}"; then
              echo "::error::docker-file must be an existing file inside the repository, got '${DOCKER_FILE}'"
              exit 1
            fi
          fi
          if [[ "${PLATFORM}" == *,* || -z "${PLATFORM}" ]]; then
            echo "::error::platform takes exactly one platform, got '${PLATFORM}'. Call the workflow once per architecture"
            exit 1
          fi
          if [[ -z "$(tr -d '[:space:]' <<<"${TAGS}")" ]]; then
            echo "::error::the tags input is empty"
            exit 1
          fi
          if [[ "${PUSH}" == "true" && -z "${REGISTRY_USERNAME}" ]]; then
            echo "::error::push is true but REGISTRY_USERNAME is empty. Pass REGISTRY_USERNAME / REGISTRY_PASSWORD by name in the caller's secrets block${ENVIRONMENT:+, and store them in the ${ENVIRONMENT} environment}"
            exit 1
          fi
          if [[ "${PUSH}" == "true" && -z "${ENVIRONMENT}" ]]; then
            echo "::warning::pushing with registry credentials outside a GitHub environment: any workflow on any branch can read them. Set the environment input"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Chainguard
        if: env.HAS_CGR == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CGR_USERNAME }}
          password: ${{ secrets.CGR_PASSWORD }}

      - name: Login to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.vendor=zama.ai

      # One build, pushed by digest only: the tags come last, once the digest is scanned and signed.
      - name: Build and push by digest
        id: build
        if: inputs.push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ inputs.docker-context }} # zizmor: ignore[template-injection] validated as a local path in "Check inputs"
          file: ${{ inputs.docker-file }}
          target: ${{ inputs.docker-target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          platforms: ${{ inputs.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          pull: true
          cache-from: type=gha,scope=${{ inputs.cache-scope || inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope || inputs.image-name }}

      - name: Build locally
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ inputs.docker-context }} # zizmor: ignore[template-injection] validated as a local path in "Check inputs"
          file: ${{ inputs.docker-file }}
          target: ${{ inputs.docker-target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          platforms: ${{ inputs.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: ${{ env.IMAGE }}:ci-local
          pull: true
          cache-from: type=gha,scope=${{ inputs.cache-scope || inputs.image-name }}

      - name: Image reference
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ "${PUSH}" == "true" ]]; then
            # Fail before signing rather than after: a signed digest with no tag is useless.
            [[ -n "$(tr -d '[:space:]' <<<"${TAGS}")" ]] || { echo "::error::no tag computed for this ref, check the tags rules"; exit 1; }
            [[ "${DIGEST}" == sha256:* ]] || { echo "::error::the build returned no digest"; exit 1; }
            echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${IMAGE}:ci-local" >> "$GITHUB_OUTPUT"
          fi

      # No TRIVY_USERNAME/PASSWORD: Trivy would offer them to every registry it contacts (its DB
      # mirrors included). It reads the registry login from the host-scoped docker config instead.
      - name: Scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          format: table
          exit-code: ${{ inputs.scan-exit-code }}
          ignore-unfixed: ${{ inputs.scan-ignore-unfixed }}
          severity: ${{ inputs.scan-severity }}
          vuln-type: os,library

      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Reads the base images from the build's own provenance, so it checks exactly what was used.
      - name: Verify base images (gate)
        if: inputs.push && inputs.verify-base-images
        env:
          REF: ${{ steps.ref.outputs.ref }}
          PREFIXES: ${{ inputs.base-image-prefixes }}
          IDENTITY_RE: ${{ inputs.base-image-identity-regexp }}
        run: |
          set -euo pipefail
          # Fails closed: an unreadable provenance, an empty material list or zero verified images
          # stop the job. Values are captured first so a failing command aborts under `set -e`.
          provenance="$(docker buildx imagetools inspect "${REF}" --format '{{ json .Provenance }}')"
          materials="$(jq -r '[.. | objects | (.materials?, .buildDefinition?.resolvedDependencies?) | select(type == "array") | .[]
            | select(.uri?) | "\(.uri) \(.digest.sha256 // "")"] | unique[]' <<<"${provenance}")"
          [[ -n "${materials}" ]] || { echo "::error::no build materials in the provenance of ${REF}"; exit 1; }
          read -r -a prefixes <<<"${PREFIXES}"
          checked=0
          while IFS= read -r entry; do
            uri="${entry%% *}"; material_digest="${entry#* }"
            [[ "${uri}" == pkg:docker/* ]] || continue
            ref="${uri#pkg:docker/}"
            name="${ref%%@*}"; name="${name%%\?*}"
            digest="${material_digest:+sha256:${material_digest}}"
            match=false
            for prefix in "${prefixes[@]}"; do [[ "${name}" == "${prefix}"* ]] && match=true; done
            [[ "${match}" == "true" ]] || { echo "skip ${name} (not a verified prefix)"; continue; }
            [[ -n "${digest}" ]] || { echo "::error::no digest for base image ${name} in the provenance"; exit 1; }
            echo "verify ${name}@${digest}"
            cosign verify \
              --certificate-oidc-issuer https://issuer.enforce.dev \
              --certificate-identity-regexp "${IDENTITY_RE}" \
              "${name}@${digest}" > /dev/null
            checked=$((checked + 1))
          done <<<"${materials}"
          if [[ "${checked}" -eq 0 ]]; then
            echo "::error::no base image matched '${PREFIXES}': nothing was verified. Build FROM a matching image, adjust base-image-prefixes, or set verify-base-images: false"
            exit 1
          fi
          echo "verified ${checked} base image(s)"

      - name: Sign
        if: inputs.push
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: cosign sign --yes --recursive "${REF}"

      # A cosign-signed SBOM, which admission policies such as Kyverno verifyImages attestations
      # can require.
      - name: Attest SBOM
        if: inputs.push
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          sboms="$(docker buildx imagetools inspect "${REF}" --format '{{ json .SBOM }}')"
          index="$(docker buildx imagetools inspect --raw "${REF}")"
          manifests="$(jq -r '.manifests[] | select(.platform.os != "unknown")
            | "\(.digest) \(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end)"' <<<"${index}")"
          [[ "$(grep -c . <<<"${manifests}")" -eq 1 ]] || { echo "::error::expected exactly one platform manifest in ${REF}"; exit 1; }
          digest="${manifests%% *}"; platform="${manifests#* }"
          jq --arg p "${platform}" 'if has("SPDX") then .SPDX else .[$p].SPDX end' <<<"${sboms}" > sbom.spdx.json
          [[ -n "$(jq -r '.spdxVersion // empty' sbom.spdx.json)" ]] || { echo "::error::no SPDX SBOM for ${platform}"; exit 1; }
          # On the platform manifest and on the index the tags point at, so a policy finds it
          # whichever digest it resolves.
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${digest}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${REF}"
          rm -f sbom.spdx.json

      - name: Verify signature
        if: inputs.push
        env:
          REF: ${{ steps.ref.outputs.ref }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^${SERVER_URL}/zama-ai/ci-templates/\.github/workflows/common-docker-product\.yml@" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            "${REF}" > /dev/null
          echo "signature verified for ${REF}"

      - name: Publish tags
        if: inputs.push
        env:
          REF: ${{ steps.ref.outputs.ref }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do [[ -n "${tag}" ]] && args+=(--tag "${tag}"); done <<<"${TAGS}"
          docker buildx imagetools create "${args[@]}" "${REF}"

      - name: Result
        id: result
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "image=${IMAGE}"
            echo "digest=${DIGEST}"
            echo "tags<<EOF"
            if [[ "${PUSH}" == "true" ]]; then echo "${TAGS}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ${IMAGE}"
            if [[ "${PUSH}" == "true" ]]; then
              echo "Signed digest: \`${DIGEST}\`"
              echo '```'
              echo "${TAGS}"
              echo '```'
            else
              echo "Built and scanned locally, not pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
